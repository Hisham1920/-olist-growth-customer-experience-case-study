name: Publish Olist case study

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and verify Olist dataset
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --retry 3 --output /tmp/olist.zip \
            "https://www.kaggle.com/api/v1/datasets/download/olistbr/brazilian-ecommerce"
          mkdir -p /tmp/olist
          unzip -q /tmp/olist.zip -d /tmp/olist
          cd /tmp/olist
          sha256sum -c <<'CHECKSUMS'
          983a422239e1712ded753b3bf9ecf47dc73f144d306029dcfa99e70a226883d2  olist_customers_dataset.csv
          b514f6fc991b9566aeba02aa5d67e2c3630f034b60a0e05aa0d082a3b66d88d6  olist_geolocation_dataset.csv
          0bc4d068c4fe38cbb01bd90e8746e3c613fe7b4baef75fab7b0e329701c3e279  olist_order_items_dataset.csv
          4f713964f2815dbbaa40b9488268c55aac3627bfce5aa96cf58d1f3616de3cc0  olist_order_payments_dataset.csv
          012b61c7593e34f51fa614efdf802b9c7056ce6aae5307ddb93236e7cfc797d7  olist_order_reviews_dataset.csv
          8df58ef3d2d7e9944010f7beecd9b75367f5588ec6e3c91cec19ae3345ef9ecf  olist_orders_dataset.csv
          3e6569628a17fbc75fd206ee357b59e20364b9afa90f5b6cd5b4d624c58aa9cc  olist_products_dataset.csv
          1f643d2b950373b85735e7794b20986f528d7a000432e7c6f9bcbb44d0846a0e  olist_sellers_dataset.csv
          a81f0d1f27b27e7293f761bc79e3ce8f348ee39c4b3ed3e49bde38f478586278  product_category_name_translation.csv
          CHECKSUMS
          cp olist_customers_dataset.csv "$GITHUB_WORKSPACE/"
          cp olist_geolocation_dataset.csv "$GITHUB_WORKSPACE/"
          cp olist_order_items_dataset.csv "$GITHUB_WORKSPACE/"
          cp olist_order_payments_dataset.csv "$GITHUB_WORKSPACE/"
          cp olist_order_reviews_dataset.csv "$GITHUB_WORKSPACE/"
          cp olist_orders_dataset.csv "$GITHUB_WORKSPACE/"
          cp olist_products_dataset.csv "$GITHUB_WORKSPACE/"
          cp olist_sellers_dataset.csv "$GITHUB_WORKSPACE/"
          cp product_category_name_translation.csv "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          rm .github/workflows/publish-olist.yml

      - name: Commit verified files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Olist case study"
          git push origin HEAD:main
